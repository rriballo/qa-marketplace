version: 1

# Replace these logical names with the connection/tool names exposed in Coworker.
connections:
  adobe:
    provider: adobe-cx-coworker-gateway-or-custom-ajo
    discovery:
      - capability_discovery_if_exposed
    gateway_baseline:
      - ajo_campaign_list
      - ajo_campaign_get
      - ajo_channel_configuration_list
      - ajo_channel_configuration_get
      - search_audiences
      - preview_audience_membership
      - inspect_audience_evaluation_jobs
      - inspect_audience_export_jobs
      - search_identity_namespaces
      - search_merge_policies
    optional_custom_ajo:
      - read_journey_graph
      - read_message_content
      - validate_personalization
      - render_preview
      - capture_evidence
    accepted_runtime_inputs:
      - journey_or_campaign_id_or_url
      - supplied_journey_or_campaign_payload
  adobe_ajo_content:
    provider: existing-read-only-ajo-app-builder-mcp
    endpoint_env: AJO_MCP_URL
    default_endpoint: https://24639-418ceruleanprimate-stage.adobeioruntime.net/api/v1/web/my-mcp-server/mcp
    discovery:
      - ajo_get_capabilities
    required_content_reads:
      - ajo_content_list_templates
      - ajo_content_get_template
    optional_content_reads:
      - ajo_journey_resolve_campaigns
      - ajo_campaign_resolve_scope
      - ajo_campaign_preview_content
      - ajo_content_list_fragments
      - ajo_content_get_fragment
      - ajo_content_get_live_fragment
      - ajo_content_get_fragment_publication_status
    audience_reads:
      - ajo_aep_list_audiences
      - ajo_aep_get_audience
    required_safety:
      - read_only_qa_usage
      - content_writes_disabled
      - decisioning_writes_disabled
      - content_user_token_fallback_disabled
  atlassian:
    provider: atlassian
    endpoint: https://atlassian-public-mcp-ttzmuqtjma-uc.a.run.app/mcp
    required_capabilities:
      - getConfluenceCapabilities
      - getConfluencePage
      - inspectConfluenceQaTemplate
      - createConfluenceQaReport
      - duplicateConfluencePage
      - updateConfluenceQaOverviewFields
      - updateConfluenceChecklistRows
    optional_capabilities:
      - addConfluenceJourneyDiagram
      - updateConfluenceTemplateFields
      - updateConfluencePage
    unsupported_by_default:
      - Jira issue read/write
      - Generic Confluence attachment upload
    required_safety:
      - template_preserving_confluence_update
      - semantic_template_preflight
      - qa1_only_enforced
      - qa2_preserved
      - journey_diagram_only
    default_template_page: https://wundertracker.atlassian.net/wiki/spaces/~62fcacec2cbfba0566aca9fb/pages/16267575322/QA+-+MCP+Template
    template_override_input: template_page
    template_format_contract: plugins/adobe-qa/shared/template-format.md
    capability_contract: plugins/adobe-qa/shared/mcp-capability-map.md

write_policy:
  adobe:
    mutate: false
  jira:
    update: false
    transition: false
  confluence:
    duplicate_template: true
    update_report: true
