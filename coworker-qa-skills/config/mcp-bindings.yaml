version: 1

# Replace these logical names with the connection/tool names exposed in Coworker.
connections:
  adobe:
    provider: adobe-cx-coworker-gateway-or-custom-ajo
    discovery:
      - capability_discovery_if_exposed
    gateway_baseline:
      - ajo_campaign_list
      - ajo_campaign_get
      - ajo_channel_configuration_list
      - ajo_channel_configuration_get
      - search_audiences
      - inspect_audience_evaluation_jobs
      - inspect_audience_export_jobs
      - search_identity_namespaces
      - search_merge_policies
    optional_custom_ajo:
      - read_journey_graph
      - read_message_content
      - validate_personalization
      - render_preview
      - capture_evidence
  atlassian:
    provider: atlassian
    endpoint: https://atlassian-public-mcp-ttzmuqtjma-uc.a.run.app/mcp
    required_capabilities:
      - read_jira_issue
      - read_confluence_page
      - duplicate_confluence_page
      - update_confluence_page
      - attach_confluence_evidence
    default_template_page: https://wundertracker.atlassian.net/wiki/spaces/~62fcacec2cbfba0566aca9fb/pages/16267575322/QA+-+MCP+Template
    template_override_input: template_page
    template_format_contract: plugins/adobe-qa/shared/template-format.md

write_policy:
  jira:
    update: false
    transition: false
  confluence:
    duplicate_template: true
    update_report: true
